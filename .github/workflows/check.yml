name: Check LexIA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: synthetic-ci-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-lexia-security.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-lexia-security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm install --global firebase-tools@15.32.0
      - run: npm run test:emulator
      - name: Build production container with synthetic frontend configuration
        if: matrix.node == '24'
        run: docker build --build-arg VITE_FIREBASE_API_KEY="$VITE_FIREBASE_API_KEY" --build-arg VITE_FIREBASE_AUTH_DOMAIN="$VITE_FIREBASE_AUTH_DOMAIN" --build-arg VITE_FIREBASE_PROJECT_ID="$VITE_FIREBASE_PROJECT_ID" -t lexia-ci .
